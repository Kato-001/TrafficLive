<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" role="img" aria-label="Logo de TrafficLive">
  <!-- Emblema: anillos y radiales de Santa Cruz; la ruta (azul) rodea el incidente (rojo) -->
  <circle cx="210" cy="200" r="170" fill="#eef3fa" stroke="#1f5fa8" stroke-width="12"/>
  <g stroke="#b6c0cd" stroke-width="9" stroke-linecap="round" fill="none">
    <circle cx="210" cy="200" r="120"/>
    <circle cx="210" cy="200" r="65"/>
    <line x1="210" y1="178" x2="210" y2="50"/>
    <line x1="225.6" y1="184.4" x2="316.1" y2="93.9"/>
    <line x1="232" y1="200" x2="360" y2="200"/>
    <line x1="225.6" y1="215.6" x2="316.1" y2="306.1"/>
    <line x1="210" y1="222" x2="210" y2="350"/>
    <line x1="194.4" y1="215.6" x2="103.9" y2="306.1"/>
    <line x1="188" y1="200" x2="60" y2="200"/>
    <line x1="194.4" y1="184.4" x2="103.9" y2="93.9"/>
  </g>
  <!-- tramo con incidente -->
  <line x1="225.6" y1="184.4" x2="294.9" y2="115.1" stroke="#d9534f" stroke-width="13" stroke-linecap="round"/>
  <!-- ruta recalculada -->
  <path d="M103.9 306.1 L125.1 284.9 A120 120 0 0 1 294.9 115.1 L316.1 93.9" fill="none" stroke="#1f5fa8"
        stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="210" cy="200" r="22" fill="#ffffff" stroke="#1d2430" stroke-width="6"/>
  <circle cx="261" cy="149" r="17" fill="#d9534f" stroke="#ffffff" stroke-width="6"/>
  <circle cx="103.9" cy="306.1" r="19" fill="#1f8a4c" stroke="#ffffff" stroke-width="6"/>
  <circle cx="316.1" cy="93.9" r="21" fill="#1f5fa8" stroke="#ffffff" stroke-width="6"/>
  <circle cx="316.1" cy="93.9" r="7" fill="#ffffff"/>
  <!-- semáforo -->
  <rect x="300" y="238" width="62" height="150" rx="20" fill="#1d2430" stroke="#ffffff" stroke-width="7"/>
  <circle cx="331" cy="270" r="17" fill="#d9534f"/>
  <circle cx="331" cy="313" r="17" fill="#e9b949"/>
  <circle cx="331" cy="356" r="17" fill="#3fb27f"/>
  <!-- nombre -->
  <text x="210" y="468" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800"
