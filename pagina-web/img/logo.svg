  <text x="210" y="512" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17.5" font-weight="600"
        letter-spacing="3" fill="#5b6677">ÁRBOLES B+ · GRAFOS PESADOS</text>
</svg>
