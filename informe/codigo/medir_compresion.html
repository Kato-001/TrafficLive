<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Medición de compresión de imágenes</title></head>
<body>
<pre id="resultado">midiendo...</pre>
<script>
// Mismo algoritmo que la página web (pagina-web/js/app.js): lado mayor de 800 px y JPEG con calidad 0,7 (Canvas API).
const FOTOS = ["foto1.jpg", "foto2.jpg", "foto3.jpg", "foto4.jpg", "foto5.jpg"];
const BASE = "/datos_fotos/";

async function comprimir(nombre) {
  const blob = await (await fetch(BASE + nombre)).blob();
  const img = await createImageBitmap(blob);
  const escala = Math.min(1, 800 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
  const t0 = performance.now();
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const salida = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.7));
  return { foto: nombre, original_kb: blob.size / 1024, comprimida_kb: salida.size / 1024,
           original_px: `${img.width}x${img.height}`, comprimida_px: `${c.width}x${c.height}`,
           reduccion_pct: 100 * (1 - salida.size / blob.size), tiempo_ms: performance.now() - t0 };
}
window.onerror = (m) => { document.getElementById("resultado").textContent = "ERROR=" + m; };
(async () => { try {
  const filas = [];
  for (const f of FOTOS) filas.push(await comprimir(f));
  document.getElementById("resultado").textContent = "RESULTADO=" + JSON.stringify(filas);
} catch (e) { document.getElementById("resultado").textContent = "ERROR=" + e; } })();
</script>
</body>
</html>
